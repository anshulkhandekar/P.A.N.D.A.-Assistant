name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, test, build, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEMO_MODE: "true"
      ENABLE_DISCORD_QA: "false"
      OPENAI_API_KEY: ""
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/smoke.mjs
